version: 2.1
orbs:
  win: circleci/windows@5.0
  macos: circleci/macos@2.4.0

executors:
  linux-arm64:
    machine:
      image: ubuntu-2204:2024.11.1
      resource_class: arm.medium
    working_directory: ~/typedb-studio

  linux-x86_64:
    machine:
      image: ubuntu-2204:2024.11.1
    working_directory: ~/typedb-studio

  mac-arm64:
    macos:
      xcode: "16.4.0"
    resource_class: m4pro.medium
    working_directory: ~/typedb-studio

  win-x86_64:
    resource_class: windows.medium
    machine:
      image: windows-server-2022-gui:2024.01.1
    shell: cmd.exe


commands:

  fetch-submodules:
    steps:
      - run: git submodule update --init --recursive

  install-bazel-linux-x86_64:
    steps:
      - run: curl -OL https://github.com/bazelbuild/bazelisk/releases/download/v1.17.0/bazelisk-linux-amd64
      - run: sudo mv bazelisk-linux-amd64 /usr/local/bin/bazel
      - run: chmod a+x /usr/local/bin/bazel

  install-bazel-linux-arm64:
    steps:
      - run: curl -OL https://github.com/bazelbuild/bazelisk/releases/download/v1.17.0/bazelisk-linux-arm64
      - run: sudo mv bazelisk-linux-arm64 /usr/local/bin/bazel
      - run: chmod a+x /usr/local/bin/bazel

  install-bazel-mac:
    parameters:
      bazel-arch:
        type: string
    steps:
      - run: |
          curl -OL "https://github.com/bazelbuild/bazelisk/releases/download/v1.17.0/bazelisk-darwin-<<parameters.bazel-arch>>"
          sudo mv "bazelisk-darwin-<<parameters.bazel-arch>>" /usr/local/bin/bazel
          chmod a+x /usr/local/bin/bazel

  restore-npm-cache:
    steps:
      - restore_cache:
          name: Restore npm package cache
          keys:
            - pnpm-packages-{{ .Environment.CIRCLE_OS_NAME }}-{{ checksum "pnpm-lock.yaml" }}

  save-npm-cache:
    steps:
      - save_cache:
          name: Save npm package cache
          key: pnpm-packages-{{ .Environment.CIRCLE_OS_NAME }}-{{ checksum "pnpm-lock.yaml" }}
          paths:
            - ~/.pnpm-store

  install-deps-npm:
    steps:
      - run:
          name: Install pnpm package manager, then use it to install npm dependencies
          command: |
            nvm install 22
            nvm use 22
            corepack enable
            corepack prepare pnpm@10.12.1 --activate
            pnpm install

  install-rust:
    steps:
      - run: |
          curl https://sh.rustup.rs -sSf | sh -s -- -y --profile minimal --default-toolchain 1.93.1

  deploy-mac-snapshot:
    parameters:
      target-arch:
        type: string
      target-triple:
        type: string
    steps:
      - run: |
          # Rename from TypeDB convention to tauri convention
          export APPLE_PASSWORD=$APPLE_ID_PASSWORD
          if [ -z "${APPLE_ID}" ] || [ -z "${APPLE_PASSWORD}" ] || [ -z "${APPLE_TEAM_ID}" ]; then
            echo "Error: APPLE_ID, APPLE_TEAM_ID, APPLE_PASSWORD must be set to notarize"
            exit 1
          fi
          export ARTIFACT_USERNAME=$REPO_TYPEDB_USERNAME
          export ARTIFACT_PASSWORD=$REPO_TYPEDB_PASSWORD
          export DEPLOY_ARTIFACT_USERNAME=$REPO_TYPEDB_USERNAME
          export DEPLOY_ARTIFACT_PASSWORD=$REPO_TYPEDB_PASSWORD
          bazel run @typedb_dependencies//distribution/artifact:create-netrc
          # Newer Homebrew formulae (ca-certificates/openssl@3/python@3.11) can fail their
          # post-install step on the CI image and make `brew install` exit non-zero, aborting the
          # job. The pour itself succeeds, so tolerate the post-install failure and use the
          # versioned binary directly (independent of the libexec/bin post-install symlinks).
          brew install python@3.11 || brew postinstall python@3.11 || true
          PYDIR="$(brew --prefix python@3.11)"
          export PATH="$PYDIR/bin:$PYDIR/libexec/bin:$PATH"
          export PYTHON="$PYDIR/bin/python3.11"
          nvm install 22
          nvm use 22
          corepack enable
          corepack prepare pnpm@10.12.1 --activate
          pnpm build
          rustup target add <<parameters.target-triple>>
          # --define version doesn't seem to work, so we just write it into the VERSION file.
          git rev-parse HEAD > VERSION
          # ---- TEMPORARY: inline keychain setup, replacing //:setup-mac-signing-keychain ----
          # Two things the bazel keychain_setup cannot do, both suspected here:
          #  1. it omits `-A` on `security import`, so the key's ACL still asks for
          #     authorisation; headless that fails (errSecInternalComponent) or hangs.
          #  2. it cannot place chain certs. The renewed TYPEDB leaf chains via the G2
          #     intermediate, which macOS does not preinstall (the old Vaticle leaf used G1,
          #     which it does). SIP blocks installing G2 into /Library/Keychains/System.keychain,
          #     so put it in the signing keychain instead.
          runt() { perl -e 'alarm shift; exec @ARGV' "$@"; }   # macOS has no GNU timeout
          KC=typedb-studio-apple-signing-keychain
          KCPW="ci-$RANDOM-$RANDOM"
          IDENT="Developer ID Application: TYPEDB LTD (RHKH8FP9SX)"
          P12=/tmp/signing.p12
          if [ -z "${APPLE_SIGNING_IDENTITIES_PASSWORD:-}" ]; then
            echo "Error: APPLE_SIGNING_IDENTITIES_PASSWORD must be set to sign"; exit 1
          fi
          curl -sS --netrc --max-time 60 -o "$P12" \
            https://repo.typedb.com/basic/private-tools/raw/files/TypeDBDeveloperIDCombined.p12
          echo "p12 sha256: $(shasum -a 256 "$P12" | awk '{print $1}')"
          echo "   expected: 51807e7c881c1e7885d55fa6a74f4d0229787bcc5fdd164b33b81238b0199baf"
          security delete-keychain "$KC" 2>/dev/null || true
          security create-keychain -p "$KCPW" "$KC"
          security default-keychain -s "$KC"
          security unlock-keychain -p "$KCPW" "$KC"
          security set-keychain-settings "$KC"
          security list-keychains -d user -s login.keychain "$KC"
          security import "$P12" -k "$KC" -P "$APPLE_SIGNING_IDENTITIES_PASSWORD" \
            -A -T /usr/bin/codesign -T /usr/bin/productsign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KCPW" "$KC" >/dev/null
          curl -sS --max-time 30 -o /tmp/g2.cer \
            https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer || true
          security import /tmp/g2.cer -k "$KC" -t cert -f openssl 2>/dev/null || true
          security find-certificate -a -c "Apple Root CA" -p \
            /System/Library/Keychains/SystemRootCertificates.keychain > /tmp/roots.pem 2>/dev/null || true
          rm -f /tmp/r.*.pem
          awk '/BEGIN CERT/{n++} {print > ("/tmp/r."n".pem")}' /tmp/roots.pem || true
          for f in /tmp/r.*.pem; do
            cn=$(openssl x509 -in "$f" -noout -subject 2>/dev/null | sed 's/.*CN=//; s/,.*//')
            if [ "$cn" = "Apple Root CA" ]; then
              security import "$f" -k "$KC" -t cert -f openssl 2>/dev/null || true
            fi
          done
          rm -f "$P12" /tmp/g2.cer /tmp/roots.pem /tmp/r.*.pem
          echo "===== shell/process architecture (x86_64 job runs Intel bazel under Rosetta) ====="
          echo "arch=$(arch)  uname -m=$(uname -m)"
          echo "codesign is: $(file -b /usr/bin/codesign | head -1)"
          echo "security  is: $(file -b /usr/bin/security | head -1)"
          echo "===== keychain state ====="
          echo "default: $(security default-keychain 2>&1 | tr -d ' \"')"
          echo "search list (combined):"; security list-keychains || true
          echo "search list (user):"; security list-keychains -d user || true
          security show-keychain-info "$KC" || true
          echo "===== identities ====="
          runt 30 security find-identity -v -p codesigning "$KC" || true
          echo "===== certs now in the signing keychain ====="
          security find-certificate -a -Z "$KC" 2>/dev/null | grep '"labl"' || true
          echo "===== codesign probe, 30s cap so it cannot hang the job ====="
          cp /bin/echo /tmp/probe-bin
          rc=0; runt 30 codesign -vvvv --force --timestamp=none --sign "$IDENT" /tmp/probe-bin || rc=$?
          echo "probe exit=$rc"
          if [ "$rc" != "0" ]; then
            echo "----- retrying once after 10s, to tell a hard failure from a flake -----"
            sleep 10
            cp /bin/echo /tmp/probe-bin
            rc2=0; runt 30 codesign -vvvv --force --timestamp=none --sign "$IDENT" /tmp/probe-bin || rc2=$?
            echo "probe retry exit=$rc2"
            echo "----- and once with the keychain explicitly re-unlocked -----"
            security unlock-keychain -p "$KCPW" "$KC" || true
            cp /bin/echo /tmp/probe-bin
            rc3=0; runt 30 codesign -vvvv --force --timestamp=none --keychain "$KC" --sign "$IDENT" /tmp/probe-bin || rc3=$?
            echo "probe re-unlock exit=$rc3"
          fi
          if [ "$rc" = "0" ]; then
            echo "PROBE SIGNED OK - embedded chain:"
            runt 20 codesign -dvvv /tmp/probe-bin 2>&1 | grep -iE "Authority|TeamIdentifier" || true
          fi
          rm -f /tmp/probe-bin
          echo "===== runner environment ====="
          sw_vers || true
          xcodebuild -version 2>/dev/null | head -2 || true
          echo "codesign: $(codesign --version 2>&1 || true)"
          echo "===== does the RUNNER preinstall the G2 intermediate? ====="
          # Answers whether a newer/older Xcode image would even help.
          security find-certificate -a -c "Developer ID Certification Authority" -p \
            /System/Library/Keychains/SystemRootCertificates.keychain > /tmp/sysi.pem 2>/dev/null || true
          rm -f /tmp/si.*.pem
          awk '/BEGIN CERT/{n++} {print > ("/tmp/si."n".pem")}' /tmp/sysi.pem || true
          for f in /tmp/si.*.pem; do
            openssl x509 -in "$f" -noout -subject 2>/dev/null | grep -o 'OU=[^,]*' || true
          done
          rm -f /tmp/sysi.pem /tmp/si.*.pem
          echo "===== control: can codesign sign AD-HOC on this runner at all? ====="
          # Ad-hoc needs no identity, keychain or trust. If THIS fails, codesign/Security on the
          # runner is broken generally and the certificate work is a red herring.
          cp /bin/echo /tmp/adhoc-bin
          arc=0; runt 30 codesign -vvvv --force --sign - /tmp/adhoc-bin || arc=$?
          echo "ad-hoc exit=$arc"
          rm -f /tmp/adhoc-bin
          echo "===== end inline setup ====="
          # ---- end TEMPORARY ----
          npx tauri build --target <<parameters.target-triple>>
          bazel run --define version=$(git rev-parse HEAD) //:deploy-mac-<<parameters.target-arch>>-dmg -- snapshot

  deploy-mac-release:
    parameters:
      target-arch:
        type: string
      target-triple:
        type: string
    steps:
      - run: |
          # Rename from TypeDB convention to tauri convention
          export APPLE_PASSWORD=$APPLE_ID_PASSWORD
          if [ -z "${APPLE_ID}" ] || [ -z "${APPLE_PASSWORD}" ] || [ -z "${APPLE_TEAM_ID}" ]; then
            echo "Error: APPLE_ID, APPLE_TEAM_ID, APPLE_PASSWORD must be set to notarize"
            exit 1
          fi
          export ARTIFACT_USERNAME=$REPO_TYPEDB_USERNAME
          export ARTIFACT_PASSWORD=$REPO_TYPEDB_PASSWORD
          export DEPLOY_ARTIFACT_USERNAME=$REPO_TYPEDB_USERNAME
          export DEPLOY_ARTIFACT_PASSWORD=$REPO_TYPEDB_PASSWORD
          bazel run @typedb_dependencies//distribution/artifact:create-netrc
          # Newer Homebrew formulae (ca-certificates/openssl@3/python@3.11) can fail their
          # post-install step on the CI image and make `brew install` exit non-zero, aborting the
          # job. The pour itself succeeds, so tolerate the post-install failure and use the
          # versioned binary directly (independent of the libexec/bin post-install symlinks).
          brew install python@3.11 || brew postinstall python@3.11 || true
          PYDIR="$(brew --prefix python@3.11)"
          export PATH="$PYDIR/bin:$PYDIR/libexec/bin:$PATH"
          export PYTHON="$PYDIR/bin/python3.11"
          nvm install 22
          nvm use 22
          corepack enable
          corepack prepare pnpm@10.12.1 --activate
          pnpm build
          rustup target add <<parameters.target-triple>>
          bazel run //:setup-mac-signing-keychain
          npx tauri build --target <<parameters.target-triple>>
          bazel run //:deploy-mac-<<parameters.target-arch>>-dmg -- release

  deploy-linux-snapshot:
    parameters:
      target-arch:
        type: string
    steps:
      - run: |
          export DEPLOY_ARTIFACT_USERNAME=$REPO_TYPEDB_USERNAME
          export DEPLOY_ARTIFACT_PASSWORD=$REPO_TYPEDB_PASSWORD
          nvm install 22
          nvm use 22
          corepack enable
          corepack prepare pnpm@10.12.1 --activate
          # CI jobs may request a throwaway build version (e.g. snapshot testing) via STUDIO_VERSION
          if [ -n "${STUDIO_VERSION:-}" ]; then pnpm set-version "${STUDIO_VERSION}"; fi
          pnpm build
          export DEBIAN_FRONTEND=noninteractive
          sudo apt-get update
          sudo apt install -y software-properties-common lsb-release curl
          sudo add-apt-repository ppa:deadsnakes/ppa -y
          sudo apt update
          echo -e '#!/bin/sh\nexit 101' | sudo tee /usr/sbin/policy-rc.d
          sudo chmod +x /usr/sbin/policy-rc.d
          sudo apt install -y python3.8 python3.8-venv python3.8-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils
          sudo ln -sf /usr/bin/python3.8 /usr/bin/python
          sudo ln -sf /usr/bin/python3.8 /usr/bin/python3
          export PATH="/usr/bin:$PATH"
          npx tauri build
          # --define version doesn't seem to work, so we just write it into the VERSION file.
          git rev-parse HEAD > VERSION
          bazel run --define version=$(git rev-parse HEAD) //:deploy-linux-<<parameters.target-arch>>-deb --compilation_mode=opt -- snapshot

  deploy-linux-release:
    parameters:
      target-arch:
        type: string
    steps:
      - run: |
          export DEPLOY_ARTIFACT_USERNAME=$REPO_TYPEDB_USERNAME
          export DEPLOY_ARTIFACT_PASSWORD=$REPO_TYPEDB_PASSWORD
          nvm install 22
          nvm use 22
          corepack enable
          corepack prepare pnpm@10.12.1 --activate
          pnpm build
          export DEBIAN_FRONTEND=noninteractive
          sudo apt-get update
          sudo apt install -y software-properties-common lsb-release curl
          sudo add-apt-repository ppa:deadsnakes/ppa -y
          sudo apt update
          echo -e '#!/bin/sh\nexit 101' | sudo tee /usr/sbin/policy-rc.d
          sudo chmod +x /usr/sbin/policy-rc.d
          sudo apt install -y python3.8 python3.8-venv python3.8-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils
          sudo ln -sf /usr/bin/python3.8 /usr/bin/python
          sudo ln -sf /usr/bin/python3.8 /usr/bin/python3
          export PATH="/usr/bin:$PATH"
          npx tauri build
          bazel run //:deploy-linux-<<parameters.target-arch>>-deb --compilation_mode=opt -- release

  deploy-apt-snapshot:
    parameters:
      target-arch:
        type: string
    steps:
      - run: |
          export DEPLOY_APT_USERNAME=$REPO_TYPEDB_USERNAME
          export DEPLOY_APT_PASSWORD=$REPO_TYPEDB_PASSWORD
          nvm install 22
          nvm use 22
          corepack enable
          corepack prepare pnpm@10.12.1 --activate
          pnpm build
          export DEBIAN_FRONTEND=noninteractive
          sudo apt-get update
          sudo apt install -y software-properties-common lsb-release curl
          sudo add-apt-repository ppa:deadsnakes/ppa -y
          sudo apt update
          echo -e '#!/bin/sh\nexit 101' | sudo tee /usr/sbin/policy-rc.d
          sudo chmod +x /usr/sbin/policy-rc.d
          sudo apt install -y python3.8 python3.8-venv python3.8-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils
          sudo ln -sf /usr/bin/python3.8 /usr/bin/python
          sudo ln -sf /usr/bin/python3.8 /usr/bin/python3
          export PATH="/usr/bin:$PATH"
          npx tauri build
          bazel run //:deploy-apt-<<parameters.target-arch>> --compilation_mode=opt -- snapshot

  deploy-apt-release:
    parameters:
      target-arch:
        type: string
    steps:
      - run: |
          export DEPLOY_APT_USERNAME=$REPO_TYPEDB_USERNAME
          export DEPLOY_APT_PASSWORD=$REPO_TYPEDB_PASSWORD
          nvm install 22
          nvm use 22
          corepack enable
          corepack prepare pnpm@10.12.1 --activate
          pnpm build
          export DEBIAN_FRONTEND=noninteractive
          sudo apt-get update
          sudo apt install -y software-properties-common lsb-release curl
          sudo add-apt-repository ppa:deadsnakes/ppa -y
          sudo apt update
          echo -e '#!/bin/sh\nexit 101' | sudo tee /usr/sbin/policy-rc.d
          sudo chmod +x /usr/sbin/policy-rc.d
          sudo apt install -y python3.8 python3.8-venv python3.8-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils
          sudo ln -sf /usr/bin/python3.8 /usr/bin/python
          sudo ln -sf /usr/bin/python3.8 /usr/bin/python3
          export PATH="/usr/bin:$PATH"
          npx tauri build
          bazel run //:deploy-apt-<<parameters.target-arch>> --compilation_mode=opt -- release

jobs:
  deploy-mac-arm64-snapshot:
    executor: mac-arm64
    steps:
      - checkout
      - fetch-submodules
      - install-bazel-mac:
          bazel-arch: arm64
      - install-deps-npm
      - install-rust
      - deploy-mac-snapshot:
          target-arch: arm64
          target-triple: aarch64-apple-darwin

  deploy-mac-x86_64-snapshot:
    executor: mac-arm64
    steps:
      - checkout
      - fetch-submodules
      - macos/install-rosetta
      - install-bazel-mac:
          bazel-arch: amd64
      - install-deps-npm
      - install-rust
      - deploy-mac-snapshot:
          target-arch: x86_64
          target-triple: x86_64-apple-darwin

  deploy-linux-arm64-snapshot:
    executor: linux-arm64
    steps:
      - checkout
      - fetch-submodules
      - install-bazel-linux-arm64
      - install-deps-npm
      - install-rust
      - deploy-linux-snapshot:
          target-arch: arm64

  deploy-linux-x86_64-snapshot:
    executor: linux-x86_64
    steps:
      - checkout
      - fetch-submodules
      - install-bazel-linux-x86_64
      - install-deps-npm
      - install-rust
      - deploy-linux-snapshot:
          target-arch: x86_64

  deploy-apt-arm64-snapshot:
    executor: linux-arm64
    steps:
      - checkout
      - fetch-submodules
      - install-bazel-linux-arm64
      - install-deps-npm
      - install-rust
      - deploy-apt-snapshot:
          target-arch: arm64

  deploy-apt-x86_64-snapshot:
    executor: linux-x86_64
    steps:
      - checkout
      - fetch-submodules
      - install-bazel-linux-x86_64
      - install-deps-npm
      - install-rust
      - deploy-apt-snapshot:
          target-arch: x86_64

  deploy-windows-x86_64-snapshot:
    executor: win-x86_64
    working_directory: ~/typedb-studio
    steps:
      - checkout
      - fetch-submodules
      - restore-npm-cache
      - run: .circleci\windows\prepare.bat
      - save-npm-cache
      - run: .circleci\windows\deploy_snapshot.bat

  deploy-mac-arm64-release:
    executor: mac-arm64
    steps:
      - checkout
      - fetch-submodules
      - install-bazel-mac:
          bazel-arch: arm64
      - install-deps-npm
      - install-rust
      - deploy-mac-release:
          target-arch: arm64
          target-triple: aarch64-apple-darwin

  deploy-mac-x86_64-release:
    executor: mac-arm64
    steps:
      - checkout
      - fetch-submodules
      - macos/install-rosetta
      - install-bazel-mac:
          bazel-arch: amd64
      - install-deps-npm
      - install-rust
      - deploy-mac-release:
          target-arch: x86_64
          target-triple: x86_64-apple-darwin

  deploy-linux-arm64-release:
    executor: linux-arm64
    steps:
      - checkout
      - fetch-submodules
      - install-bazel-linux-arm64
      - install-deps-npm
      - install-rust
      - deploy-linux-release:
          target-arch: arm64

  deploy-linux-x86_64-release:
    executor: linux-x86_64
    steps:
      - checkout
      - fetch-submodules
      - install-bazel-linux-x86_64
      - install-deps-npm
      - install-rust
      - deploy-linux-release:
          target-arch: x86_64

  deploy-apt-arm64-release:
    executor: linux-arm64
    steps:
      - checkout
      - fetch-submodules
      - install-bazel-linux-arm64
      - install-deps-npm
      - install-rust
      - deploy-apt-release:
          target-arch: arm64

  deploy-apt-x86_64-release:
    executor: linux-x86_64
    steps:
      - checkout
      - fetch-submodules
      - install-bazel-linux-x86_64
      - install-deps-npm
      - install-rust
      - deploy-apt-release:
          target-arch: x86_64

  deploy-windows-x86_64-release:
    executor: win-x86_64
    working_directory: ~/typedb-studio
    steps:
      - checkout
      - fetch-submodules
      - restore-npm-cache
      - run: .circleci\windows\prepare.bat
      - save-npm-cache
      - run: .circleci\windows\deploy_release.bat

  deploy-github:
    executor: linux-x86_64
    steps:
      - checkout
      - run:
          name: "Publish Release on GitHub"
          command: |
            wget https://github.com/tcnksm/ghr/releases/download/v0.16.2/ghr_v0.16.2_linux_amd64.tar.gz
            tar -xf ghr_v0.16.2_linux_amd64.tar.gz
            ghr_v0.16.2_linux_amd64/ghr -t ${REPO_GITHUB_TOKEN} -u ${CIRCLE_PROJECT_USERNAME} \
              -r ${CIRCLE_PROJECT_REPONAME} -n "TypeDB Studio $(cat VERSION)" -b "$(cat ./RELEASE_NOTES_LATEST.md)" \
              -c ${CIRCLE_SHA1} -delete $(cat VERSION)

  deploy-brew:
    executor: linux-x86_64
    steps:
      - attach_workspace:
          at: ~/dist
      - checkout
      - install-bazel-linux-x86_64
      - run: |
          export DEPLOY_BREW_TOKEN=$REPO_GITHUB_TOKEN DEPLOY_BREW_USERNAME=$REPO_GITHUB_USERNAME DEPLOY_BREW_EMAIL=$REPO_GITHUB_EMAIL
          sha256sum ~/dist/typedb-studio-mac-arm64.dmg | awk '{print $1}' > checksum-arm64
          sha256sum ~/dist/typedb-studio-mac-x86_64.dmg | awk '{print $1}' > checksum-x86_64
          bazel run --define version=$(cat VERSION) //:deploy-brew --//:checksum-mac-arm64=:checksum-arm64 --//:checksum-mac-x86_64=:checksum-x86_64 --compilation_mode=opt -- release

  release-cleanup:
    machine:
      image: ubuntu-2004:2023.10.1
    steps:
      - checkout
      - run: git push --delete https://$REPO_GITHUB_TOKEN@github.com/typedb/typedb-studio.git $CIRCLE_BRANCH

workflows:
  snapshot:
    jobs:
      - deploy-linux-arm64-snapshot:
          filters:
            branches:
              only: [banana]
      - deploy-linux-x86_64-snapshot:
          filters:
            branches:
              only: [banana]
      - deploy-mac-arm64-snapshot:
          filters:
            branches:
              # TEMPORARY: validating the renewed Developer ID cert; restore to
              # [banana] once a snapshot signs and notarises cleanly.
              only: [development]
      - deploy-mac-x86_64-snapshot:
          filters:
            branches:
              # TEMPORARY: validating the renewed Developer ID cert; restore to
              # [banana] once a snapshot signs and notarises cleanly.
              only: [development]
      - deploy-windows-x86_64-snapshot:
          context: [default]
          filters:
            branches:
              only: [banana]
      - deploy-apt-arm64-snapshot:
          filters:
            branches:
              only: [banana]
      - deploy-apt-x86_64-snapshot:
          filters:
            branches:
              only: [banana]
  release:
    jobs:
      - deploy-linux-arm64-release:
          filters:
            branches:
              only: master
      - deploy-linux-x86_64-release:
          filters:
            branches:
              only: master
      - deploy-mac-arm64-release:
          filters:
            branches:
              only: master
      - deploy-mac-x86_64-release:
          filters:
            branches:
              only: master
      - deploy-windows-x86_64-release:
          context: [default]
          filters:
            branches:
              only: master
      - deploy-github:
          filters:
            branches:
              only: master
          requires:
            - deploy-linux-arm64-release
            - deploy-linux-x86_64-release
            - deploy-mac-arm64-release
            - deploy-mac-x86_64-release
            - deploy-windows-x86_64-release
      - deploy-apt-arm64-release:
          filters:
            branches:
              only: watermelon
          requires:
            - deploy-linux-arm64-release
      - deploy-apt-x86_64-release:
          filters:
            branches:
              only: watermelon
          requires:
            - deploy-linux-x86_64-release
      - deploy-brew:
          filters:
            branches:
              only: watermelon
          requires:
            - deploy-mac-arm64-release
            - deploy-mac-x86_64-release
      - release-cleanup:
          filters:
            branches:
              only: watermelon
          requires:
            - deploy-github
            - deploy-brew
